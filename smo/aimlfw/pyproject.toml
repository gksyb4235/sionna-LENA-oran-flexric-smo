[project]
name = "smo-aimlfw"
version = "0.1.0"
description = "Minimal local AI/ML Framework contracts and services"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.138.2",
    "httpx==0.28.1",
    "pydantic==2.12.5",
    "pymongo==4.11.3",
    "PyYAML==6.0.3",
    "torch==2.13.0",
    "uvicorn==0.49.0",
]

[project.optional-dependencies]
test = [
    "hypothesis==6.112.1",
    "pytest==9.0.2",
]
agentic = [
    "langchain>=1.3.11,<2.0.0",
    "langchain-openai>=1.3.3",
    "langgraph>=1.0.0,<2.0.0",
]

[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["../tests/unit", "../tests/property"]
markers = [
    "property: property-based test with design Property and Validates tags",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
