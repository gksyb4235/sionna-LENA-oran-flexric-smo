[project]
name = "kpi-advisor-agent"
version = "0.1.0"
description = "Evidence-backed KPI Advisor sub-agent for the SMO multi-agent runtime"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.138.2",
    "httpx==0.28.1",
    "mcp==1.29.1",
    "pydantic==2.13.4",
    "uvicorn==0.49.0",
]

[build-system]
requires = ["setuptools==82.0.1", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "agent",
    "conflict_analyzer",
    "evidence_store",
    "mcp_server",
    "policy_manager",
    "probing",
    "runtime_registration",
    "schemas",
    "server",
    "temporal_scheduler",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "property: property-based test with design Property and Validates tags",
]
