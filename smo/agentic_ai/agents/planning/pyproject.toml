[project]
name = "planning-agent"
version = "0.1.0"
description = "Planning agent for the jaechan multi-agent system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents @ file:///home/ubuntu/jaechan/deepagents/libs/deepagents",
    "fastapi>=0.124.0",
    "httpx>=0.28.1",
    "langchain>=1.3.11,<2.0.0",
    "langchain-openai>=1.3.3",
    "pymongo>=4.15.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.38.0",
]

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["agent", "schemas", "server"]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
